# ============================================================
# docker-compose.yml
# 개발용 인프라: PostgreSQL + Kafka(KRaft 모드) + Kafka UI
#
# Zookeeper 없이 KRaft 모드로 Kafka를 단일 노드로 실행한다.
# (Kafka 3.3+ 부터 지원, 최신 트렌드)
#
# 사용:
#   docker compose up -d          # 백그라운드 실행
#   docker compose ps             # 상태 확인
#   docker compose logs -f kafka  # 로그 확인
#   docker compose down           # 중지 (데이터 유지)
#   docker compose down -v        # 중지 + 데이터 볼륨 삭제
# ============================================================

services:
  # --------------------------------------------------------
  # PostgreSQL - 이벤트/집계 데이터 저장소
  # --------------------------------------------------------
  postgres:
    image: postgres:16
    container_name: projecte-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: projecte
    # backend 의 커넥션 풀(pool_size 20 + max_overflow 30 = 최대 50)에
    # Airflow, postgres-exporter 등 다른 서비스 커넥션까지 더해 기본값(100)
    # 만으로도 여유는 있지만, 명시적으로 올려서 향후 확장에도 대비한다.
    # (docs/perf/002-stress-test.md 에서 발견한 커넥션 풀 고갈 대응)
    command: ["postgres", "-c", "max_connections=200"]
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # 컨테이너 최초 기동 시 airflow 메타데이터용 DB를 자동 생성
      - ./airflow/init-airflow-db.sql:/docker-entrypoint-initdb.d/init-airflow-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d projecte"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --------------------------------------------------------
  # Kafka - KRaft 모드 (단일 노드, broker + controller 겸용)
  # --------------------------------------------------------
  kafka:
    image: apache/kafka:3.9.1
    container_name: projecte-kafka
    ports:
      # 9092: 호스트(로컬 FastAPI/시뮬레이터)에서 접속하는 포트
      - "9092:9092"
    environment:
      # --- KRaft 필수 설정 ---
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # --- 리스너 설정 ---
      # PLAINTEXT: 컨테이너 내부/다른 컨테이너용 (kafka:29092)
      # PLAINTEXT_HOST: 호스트(로컬 PC)에서 접속용 (localhost:9092)
      KAFKA_LISTENERS: "PLAINTEXT://:29092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # --- 단일 노드용 설정 (복제 계수 1) ---
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # 없는 토픽으로 send 하면 자동 생성 (개발 편의)
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5

  # --------------------------------------------------------
  # Kafka UI - 브라우저에서 토픽/메시지 확인 (localhost:8080)
  # 개발 편의용. 없어도 파이프라인은 동작함.
  # (provectuslabs/kafka-ui 는 아카이브되어, 이어받은 kafbat 포크 사용)
  # --------------------------------------------------------
  kafka-ui:
    image: kafbat/kafka-ui:latest
    container_name: projecte-kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: projecte
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      - kafka

  # ========================================================
  # Airflow (배치 ETL) — LocalExecutor, 단일 노드 경량 구성
  #
  # - 메타데이터 DB: 기존 postgres 컨테이너 안에 별도 DB(airflow) 사용
  #   (postgres 컨테이너 최초 기동 시 아래 init 스크립트가 airflow DB 생성)
  # - DAG은 raw_events 가 있는 애플리케이션 DB(projecte)에 붙어서 집계
  #   → AIRFLOW_CONN_PROJECTE_DB 커넥션으로 연결
  # ========================================================
  airflow-init:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    image: projecte-airflow:3.3.0
    container_name: projecte-airflow-init
    depends_on:
      postgres:
        condition: service_healthy
    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:postgres@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      # Airflow 3.x 는 SimpleAuthManager 가 기본값이므로 auth_manager를 따로 지정하지 않는다.
      # Airflow 3.x: 워커가 태스크 실행 시 api-server에 HTTP로 접속한다.
      # 기본값(localhost)은 컨테이너 자신을 가리켜 접속 실패하므로, api-server 컨테이너 주소를 명시.
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
      # Airflow 3.x: 워커-apiserver 간 JWT 토큰 서명에 쓰는 공유 비밀 키.
      # 지정하지 않으면 각 컨테이너가 랜덤 키를 만들어 "Invalid auth token" 에러 발생.
      # (개발용 고정값. 운영에서는 안전한 랜덤 값을 시크릿으로 주입)
      AIRFLOW__API_AUTH__JWT_SECRET: "projecte-dev-jwt-secret-please-change-in-prod-0123456789abcdef"
      # DAG이 raw_events를 읽기 위한 애플리케이션 DB 커넥션 (projecte_db)
      AIRFLOW_CONN_PROJECTE_DB: postgresql://postgres:postgres@postgres:5432/projecte
      # Airflow 3.x SimpleAuthManager 로그인 계정
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "admin:admin"
      # 비밀번호를 고정하기 위해 미리 만든 파일 지정 (매번 랜덤 생성 방지)
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/simple_auth_manager_passwords.json
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/simple_auth_manager_passwords.json:/opt/airflow/simple_auth_manager_passwords.json
    # DB 마이그레이션만 수행 후 종료 (1회성). 계정은 SimpleAuthManager가 환경변수로 관리.
    entrypoint: /bin/bash
    command:
      - -c
      - "airflow db migrate"

  airflow-apiserver:
    image: projecte-airflow:3.3.0
    container_name: projecte-airflow-apiserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-env
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/simple_auth_manager_passwords.json:/opt/airflow/simple_auth_manager_passwords.json
    ports:
      - "8081:8080"        # Airflow 웹 UI (Kafka UI가 8080이라 8081로)
    command: api-server
    restart: unless-stopped

  airflow-scheduler:
    image: projecte-airflow:3.3.0
    container_name: projecte-airflow-scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-env
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/simple_auth_manager_passwords.json:/opt/airflow/simple_auth_manager_passwords.json
    command: scheduler
    restart: unless-stopped

  # Airflow 3.x: DAG 파싱을 담당하는 별도 컴포넌트
  airflow-dag-processor:
    image: projecte-airflow:3.3.0
    container_name: projecte-airflow-dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-env
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/simple_auth_manager_passwords.json:/opt/airflow/simple_auth_manager_passwords.json
    command: dag-processor
    restart: unless-stopped

  # ========================================================
  # 애플리케이션 서비스 (backend / frontend / dashboard)
  # 개발 편의를 위해 코드는 볼륨 마운트로 제공한다 (수정 시 재빌드 불필요).
  # Spark는 Java/리소스 설정이 까다로워 컨테이너화하지 않고 로컬에서 실행한다.
  # ========================================================
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: projecte-backend
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      # 컨테이너 안에서는 localhost가 아니라 서비스 이름으로 접속한다.
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/projecte
      FRONTEND_ORIGIN: http://localhost:5173
      ENV: docker
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_EVENTS_TOPIC: user-events
      USE_KAFKA: "true"
      # 개발용 고정값. 운영 배포 시 반드시 강력한 랜덤 값으로 교체할 것.
      JWT_SECRET_KEY: dev-only-secret-change-me-0123456789abcdef
      # 기본은 개발 모드(워커 1개, --reload). 부하 테스트 시에는
      #   WORKERS=4 docker compose up -d --force-recreate backend
      # 처럼 오버라이드해서 재시작한다 (docs/perf/002-stress-test.md 참고).
      WORKERS: "${WORKERS:-1}"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: projecte-frontend
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules   # 호스트의 node_modules로 덮어써지지 않도록 보호
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    container_name: projecte-dashboard
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DASHBOARD_DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/projecte
    ports:
      - "8501:8501"
    volumes:
      - ./dashboard:/app
    restart: unless-stopped

  # ========================================================
  # 모니터링 (adrs/0001-monitoring-tool-selection.md)
  # ========================================================
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: projecte-prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.1
    container_name: projecte-grafana
    depends_on:
      - prometheus
    environment:
      # 개발용 고정 계정. 운영 배포 시 반드시 교체.
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      # provisioning 파일 변경만으로 재시작 없이 반영되도록
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    restart: unless-stopped

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: projecte-postgres-exporter
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:postgres@postgres:5432/projecte?sslmode=disable"
    ports:
      - "9187:9187"
    restart: unless-stopped

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.7.0
    container_name: projecte-kafka-exporter
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - "--kafka.server=kafka:29092"
    ports:
      - "9308:9308"
    restart: unless-stopped

volumes:
  postgres-data:
  kafka-data:
  prometheus-data:
  grafana-data: