name: projecte_dbt
version: "1.0.0"
config-version: 2

profile: projecte

model-paths: ["models"]
test-paths: ["tests"]

# target-path/log-path/packages-install-path를 여기 하드코딩하지 않는다.
# dbt_project.yml에 넣으면 dbt-core 1.8+에서 deprecation 경고/에러가
# 나고, 실행 환경(Airflow 컨테이너 vs CI 러너)마다 쓰기 가능한 경로가
# 달라서 값도 달라야 한다. 대신 DBT_TARGET_PATH/DBT_LOG_PATH 환경변수로
# 각 실행 지점(Airflow DAG, CI 워크플로우)이 필요할 때만 지정한다.

models:
  projecte_dbt:
    staging:
      +materialized: view
    marts:
      +materialized: table