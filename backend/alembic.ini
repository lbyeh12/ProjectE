[alembic]
script_location = alembic

# 마이그레이션 파일 이름 형식: 0001_설명.py 처럼 순서를 한눈에 보이게
file_template = %%(rev)s_%%(slug)s

# sqlalchemy.url 은 env.py에서 app.config.settings.database_url 로 덮어쓴다.
# (환경변수/​.env 값을 그대로 재사용하기 위해. 여기 값은 사용되지 않는다)
sqlalchemy.url = driver://user:pass@localhost/dbname

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
